name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build & publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package (electron-builder, publish always)
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing/notarization only when secrets exist; unsigned mac
          # artifacts are still produced (auto-update inert without signing)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Warn when macOS signing secrets are absent
        if: matrix.os == 'macos-latest' && secrets.CSC_LINK == ''
        run: echo "::warning::macOS build is UNSIGNED — dmg installs fine but auto-update is inert (PLAN.md §12.6)."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/latest-mac.yml
            release/latest-linux.yml
          if-no-files-found: warn
          retention-days: 14

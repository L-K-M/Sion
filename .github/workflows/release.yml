name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  native-macos:
    name: Build native macOS release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source
        id: source
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag v$tag_version != app version $app_version"
            exit 1
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != 'tag' ]; then
            echo "::error::$GITHUB_REF must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit is not on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: scripts/build.sh --clean
      - name: Archive
        run: |
          mkdir -p release
          archive="release/Sion-${{ steps.source.outputs.version }}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent build/Sion.app "$archive"
          shasum -a 256 "$archive" > release/SHA256SUMS.txt
      - name: Publish draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Sion ${{ steps.source.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

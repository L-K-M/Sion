name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify release source
        id: source
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          lock_root_version="$(node -p "require('./package-lock.json').packages[''].version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::tag v$tag_version != package.json $package_version"
            exit 1
          fi
          if [ "$package_version" != "$lock_version" ] || [ "$package_version" != "$lock_root_version" ]; then
            echo "::error::package.json and package-lock.json versions differ"
            exit 1
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != 'tag' ]; then
            echo "::error::$GITHUB_REF must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit is not on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run check
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run Playwright
        run: xvfb-run -a npm run e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build-macos:
    name: Package macOS
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - name: Package
        run: |
          if [ -n "${CSC_LINK:-}" ]; then
            npx electron-builder --mac --arm64 --x64 --publish never
          else
            echo "::warning::CSC_LINK not set; macOS packages are unsigned"
            npx electron-builder --mac --arm64 --x64 --publish never -c.mac.identity=null
          fi
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-macos
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Package Linux
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run build
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y binutils rpm xz-utils
      - name: Package
        run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-linux
          path: |
            release/*.AppImage
            release/*.AppImage.blockmap
            release/*.deb
            release/*.rpm
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft release
    needs: [verify, build-macos, build-linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-artifacts-*
          path: release
          merge-multiple: true
      - name: Verify artifacts
        run: |
          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          appimages=(release/*.AppImage)
          debs=(release/*.deb)
          rpms=(release/*.rpm)

          ((${#dmgs[@]} >= 2)) || { echo '::error::missing macOS DMGs'; exit 1; }
          ((${#zips[@]} >= 2)) || { echo '::error::missing macOS ZIPs'; exit 1; }
          ((${#appimages[@]} >= 1)) || { echo '::error::missing AppImage'; exit 1; }
          ((${#debs[@]} >= 1)) || { echo '::error::missing deb'; exit 1; }
          ((${#rpms[@]} >= 1)) || { echo '::error::missing rpm'; exit 1; }
          [ -s release/latest-mac.yml ] || { echo '::error::missing latest-mac.yml'; exit 1; }
          [ -s release/latest-linux.yml ] || { echo '::error::missing latest-linux.yml'; exit 1; }
          [ -z "$(find release -maxdepth 1 -type f -empty -print -quit)" ] || {
            echo '::error::empty release artifact'
            exit 1
          }

          (cd release && sha256sum -- * > SHA256SUMS.txt)
      - name: Publish draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Thalyx ${{ needs.verify.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*

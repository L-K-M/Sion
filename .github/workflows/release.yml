name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: source
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          # Resources/Info.plist is the one version source for both applications.
          app_version="$(awk '
            found && /<string>/ { gsub(/.*<string>|<\/string>.*/, ""); print; exit }
            index($0, "<key>CFBundleShortVersionString</key>") { found = 1 }
          ' Resources/Info.plist)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag v$tag_version != app version $app_version"
            exit 1
          fi

          if [ "$(git cat-file -t "$GITHUB_REF")" != 'tag' ]; then
            echo "::error::$GITHUB_REF must be an annotated tag"
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release commit is not on main"
            exit 1
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"

  native-macos:
    name: Build native macOS release
    needs: verify
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: scripts/build.sh --clean
      - name: Archive
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent build/Sion.app \
            "release/Sion-${{ needs.verify.outputs.version }}-macOS.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: release/*
          if-no-files-found: error

  native-linux:
    name: Build native Linux release
    needs: verify
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GTK and packaging tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev libpoppler-glib-dev librsvg2-common \
            xvfb dpkg-dev lintian fonts-dejavu-core
      - name: Build
        run: |
          xvfb-run -a swift test
          scripts/make-deb.sh
      - name: Archive
        run: |
          mkdir -p release
          cp build/linux/sion_*.deb release/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [verify, native-macos, native-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: |
          cd release
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish draft
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Sion ${{ needs.verify.outputs.version }}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
